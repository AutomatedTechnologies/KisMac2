name: KisMac test build

on:
  push:
    branches: [build-test-remediated]
  workflow_dispatch:

# The publish step creates a GitHub Release with GITHUB_TOKEN. Run #13
# proved build + package succeed but release creation failed with
# "HTTP 403: Resource not accessible by integration" — the token's
# default permissions on this repo do not include contents: write.
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcrun --show-sdk-path

      - name: Verify notification identity + Growl excision source (SDS-10 10.6)
        run: |
          # SDS-10 10.6 both halves (finding S-03, KisMac line). First
          # half: the attributed name is the ship name, read from the
          # main bundle at runtime. Second half (10.6.5): NO
          # third-party notification intermediary -- Growl (separate
          # app, retired 2020, self-asserted unauthenticated sender
          # identity) is excised; posting is native
          # NSUserNotificationCenter from the main bundle.
          F="Sources/Controller/GrowlController.m"
          H="Sources/Controller/GrowlController.h"
          test "$(grep -c 'deliverNativeNotificationWithDescription' "$F")" -ge 3
          grep -q 'NSUserNotificationCenter' "$F"
          for pat in 'GrowlApplicationBridge' 'GROWL_NOTIFICATIONS' 'Growl.framework' 'setGrowlDelegate' 'applicationNameForGrowl' 'registrationDictionaryForGrowl' 'notifyWithTitle'; do
            if grep -q "$pat" "$F" "$H"; then echo "FAIL: Growl remnant in notification source: $pat"; exit 1; fi
          done
          if grep -q 'Growl.framework' KisMac2.xcodeproj/project.pbxproj; then echo "FAIL: Growl.framework still referenced in project"; exit 1; fi
          if [ -e "Resources/Growl.framework" ]; then echo "FAIL: Resources/Growl.framework still in tree"; exit 1; fi
          echo "Notification identity + excision source gate: PASS (native posting, ship name from main bundle, no Growl)"

      - name: Prepare framework-style include shim
        run: |
          SHIM="$GITHUB_WORKSPACE/.ci-include-shim"
          mkdir -p "$SHIM/BIGL" "$SHIM/BIGeneric"
          find "$GITHUB_WORKSPACE/Subprojects/BIGeneric/Submodules/BIGL/Classes" -name '*.h' -exec ln -s {} "$SHIM/BIGL/" \;
          find "$GITHUB_WORKSPACE/Subprojects/BIGeneric/Classes" -name '*.h' -exec ln -s {} "$SHIM/BIGeneric/" \;
          ln -s "$GITHUB_WORKSPACE/Subprojects/GBStorage/GBStorage.h" "$SHIM/"
          ls -la "$SHIM" "$SHIM/BIGL" "$SHIM/BIGeneric"

      - name: Apply CI source patches (submodule working tree)
        run: |
          # BIZoomView.m lives in the BIGeneric submodule (IGRSoft/BIGeneric);
          # its contents cannot be committed through this repo, so the fix is
          # applied to the checked-out working tree: NSView _frame ivar ->
          # self.frame, 10 read sites (macOS 15.5 SDK no longer exposes the
          # ivar; run #12 diagnostic). Guarded: the step fails unless exactly
          # 10 sites exist before and 0 remain after.
          F="Subprojects/BIGeneric/Classes/BIZoomView.m"
          BEFORE=$(grep -c '_frame' "$F")
          perl -pi -e 's/\b_frame\b/self.frame/g' "$F"
          AFTER=$(grep -c 'self\.frame' "$F")
          LEFT=$(grep -c '_frame' "$F" || true)
          echo "BIZoomView.m CI patch: sites_before=$BEFORE self_frame_after=$AFTER leftover=$LEFT"
          test "$BEFORE" = "10" && test "$AFTER" = "10" && test "$LEFT" = "0"

      - name: Build KisMac2 (Release, unsigned, 10.13 floor)
        run: |
          set -o pipefail
          SHIM="$GITHUB_WORKSPACE/.ci-include-shim"
          xcodebuild -workspace KisMac2.xcworkspace -scheme KisMac2 \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=10.13 \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO \
            "HEADER_SEARCH_PATHS=$SHIM \$(inherited)" \
            build 2>&1 | tee xcodebuild.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log

      - name: Package app as zip
        if: success()
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name 'KisMac2.app' -o -name 'KisMAC.app' | grep -v '\.dSYM' | head -1)
          if [ -z "$APP" ]; then
            APP=$(find . -name '*.app' -path '*Release*' | head -1)
          fi
          echo "Built app: $APP"
          test -n "$APP"
          # Identity + audit gate (2026-11-08, RC preparation): stamp the CI
          # run tag into CFBundleVersion, then fail the run unless the built
          # plist reads back the Academy bundle ID and the Academy audit
          # entry with all flags true (Distro files/08 — Distro's installer
          # refuses anything else).
          PLIST="$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion test-build-${{ github.run_number }}" "$PLIST"
          BID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST")
          BVER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")
          AUD="com.detroitautomationacademy.audit"
          A_DIS=$(/usr/libexec/PlistBuddy -c "Print :$AUD:Disassembled" "$PLIST")
          A_SCAN=$(/usr/libexec/PlistBuddy -c "Print :$AUD:Scanned" "$PLIST")
          A_REC=$(/usr/libexec/PlistBuddy -c "Print :$AUD:Recompiled" "$PLIST")
          A_AUTH=$(/usr/libexec/PlistBuddy -c "Print :$AUD:Authority" "$PLIST")
          A_DATE=$(/usr/libexec/PlistBuddy -c "Print :$AUD:Date" "$PLIST")
          echo "Bundle identity: id=$BID version=$BVER audit=$A_DIS/$A_SCAN/$A_REC $A_AUTH $A_DATE"
          test "$BID" = "com.detroitautomationacademy.kismac"
          test "$BVER" = "test-build-${{ github.run_number }}"
          test "$A_DIS" = "true"
          test "$A_SCAN" = "true"
          test "$A_REC" = "true"
          test "$A_AUTH" = "Detroit Automation Academy"
          test "$A_DATE" = "2026-11-08"
          # SDS-10 conformance gate (SDS10-T1, Distro files/08): the built
          # plist must carry com.detroitautomationacademy.conformance with
          # exactly the clauses this build meets, all true here.
          CONF="com.detroitautomationacademy.conformance"
          C_STD=$(/usr/libexec/PlistBuddy -c "Print :$CONF:Standard" "$PLIST")
          C_LOGO=$(/usr/libexec/PlistBuddy -c "Print :$CONF:Logo" "$PLIST")
          C_VER=$(/usr/libexec/PlistBuddy -c "Print :$CONF:VersionAtStartup" "$PLIST")
          C_SND=$(/usr/libexec/PlistBuddy -c "Print :$CONF:StartupSound" "$PLIST")
          C_MENU=$(/usr/libexec/PlistBuddy -c "Print :$CONF:MenuBar" "$PLIST")
          C_NOTIF=$(/usr/libexec/PlistBuddy -c "Print :$CONF:NotificationIdentity" "$PLIST")
          C_AUTH=$(/usr/libexec/PlistBuddy -c "Print :$CONF:Authority" "$PLIST")
          C_DATE=$(/usr/libexec/PlistBuddy -c "Print :$CONF:Date" "$PLIST")
          echo "Conformance entry: Standard=$C_STD Logo=$C_LOGO VersionAtStartup=$C_VER StartupSound=$C_SND MenuBar=$C_MENU NotificationIdentity=$C_NOTIF $C_AUTH $C_DATE"
          test "$C_STD" = "SDS-10"
          test "$C_LOGO" = "true"
          test "$C_VER" = "true"
          test "$C_SND" = "true"
          test "$C_MENU" = "true"
          test "$C_NOTIF" = "true"
          test "$C_AUTH" = "Detroit Automation Academy"
          test "$C_DATE" = "2026-11-13"
          # Startup sound (SDS-10 10.3.1): the bundled asset must hash to
          # the library master, byte-identical in every app.
          SND="$APP/Contents/Resources/startup-sound.wav"
          test -f "$SND"
          SND_SHA=$(shasum -a 256 "$SND" | awk '{print $1}')
          echo "startup-sound.wav SHA-256: $SND_SHA"
          test "$SND_SHA" = "07a113244c6b432b22954a089ce519bd239311b14a48f26ae85214ed8c25b09a"
          # Academy IP texts (IP protection T2, KisMac GOAL standing
          # requirement for this build): bundle the Academy license +
          # notice in Resources, byte-identical to the governing texts
          # (the Workbench staged-v1-8 package-step precedent).
          cp LICENSE-ACADEMY.txt NOTICE.txt "$APP/Contents/Resources/"
          test -f "$APP/Contents/Resources/LICENSE-ACADEMY.txt"
          test -f "$APP/Contents/Resources/NOTICE.txt"
          # Growl excision assertion (SDS-10 10.6.5, finding S-03):
          # the shipped bundle carries no Growl.framework and the
          # binary neither links nor references it.
          test ! -e "$APP/Contents/Frameworks/Growl.framework"
          if otool -L "$APP/Contents/MacOS/KisMac2" | grep -qi growl; then echo "FAIL: binary links Growl"; exit 1; fi
          if strings "$APP/Contents/MacOS/KisMac2" | grep -q 'GrowlApplicationBridge'; then echo "FAIL: binary references GrowlApplicationBridge"; exit 1; fi
          echo "Growl excision bundle assertion: PASS (no framework, no link, no bridge symbols)"
          ditto -c -k --keepParent "$APP" KisMac-test.zip
          ls -la KisMac-test.zip

      - name: Upload test build zip (survival copy)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kismac-test-zip
          path: KisMac-test.zip

      - name: Publish prerelease with test build
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create test-build-${{ github.run_number }} KisMac-test.zip \
            --prerelease \
            --title "KisMac test build ${{ github.run_number }}" \
            --notes "Internal test build: Growl excised (SDS-10 10.6.5, finding S-03) — Growl.framework link/embed/files removed, GrowlController keeps its class name and every signature and now posts the Start/Stop Scan notifications natively via NSUserNotificationCenter from the main bundle, title read from the main bundle plist at runtime; SDS-10 conformance entry stamped (Logo/VersionAtStartup/StartupSound/MenuBar/NotificationIdentity, Date 2026-11-13), audit entry intact. SDS-8 welcome via the shared AcademyWelcomeController/AcademyAppIconView component (SDS10-T1), byte-identical startup-sound.wav (SDS-10 master), Academy IP texts bundled. Publisher: Detroit Automation Academy. Unsigned test build — not gate-cleared, not yet verified on the High Sierra rig."
