name: KisMac test build

on:
  push:
    branches: [build-test]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcrun --show-sdk-path

      - name: Build KisMac2 (Release, unsigned, 10.13 floor)
        run: |
          set -o pipefail
          xcodebuild -project KisMac2.xcodeproj -scheme KisMac2 \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=10.13 \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee xcodebuild.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log

      - name: Package app as zip
        if: success()
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name 'KisMac2.app' -o -name 'KisMAC.app' | grep -v '\.dSYM' | head -1)
          if [ -z "$APP" ]; then
            APP=$(find . -name '*.app' -path '*Release*' | head -1)
          fi
          echo "Built app: $APP"
          test -n "$APP"
          ditto -c -k --keepParent "$APP" KisMac-test.zip
          ls -la KisMac-test.zip

      - name: Publish prerelease with test build
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create test-build-${{ github.run_number }} KisMac-test.zip \
            --prerelease \
            --title "KisMac test build ${{ github.run_number }}" \
            --notes "Internal test build from AutomatedTechnologies/KisMac2@build-test. Unverified."
