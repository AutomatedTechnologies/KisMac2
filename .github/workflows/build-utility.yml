name: Network Utility V1 staged build

# Staged MVP build of the Network Utility (Switchboard V1) shell on the
# remediated KisMac tree: shell + Discover (hosted, frozen) + Manage READ +
# Diagnose subset + Journal. Adapted from the proven build-test.yml —
# identical include shim, guarded BIZoomView CI patch, workspace build,
# permissions and survival-artifact pattern. The KisMac test-build
# workflow (build-test.yml) is untouched.

on:
  push:
    branches: [network-utility-v1]
  workflow_dispatch:

# The publish step creates a GitHub Release with GITHUB_TOKEN; the repo's
# default token permissions do not include contents: write (proven by the
# KisMac run #13 failure), so it is granted explicitly here.
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcrun --show-sdk-path

      - name: Prepare framework-style include shim
        run: |
          SHIM="$GITHUB_WORKSPACE/.ci-include-shim"
          mkdir -p "$SHIM/BIGL" "$SHIM/BIGeneric"
          find "$GITHUB_WORKSPACE/Subprojects/BIGeneric/Submodules/BIGL/Classes" -name '*.h' -exec ln -s {} "$SHIM/BIGL/" \;
          find "$GITHUB_WORKSPACE/Subprojects/BIGeneric/Classes" -name '*.h' -exec ln -s {} "$SHIM/BIGeneric/" \;
          ln -s "$GITHUB_WORKSPACE/Subprojects/GBStorage/GBStorage.h" "$SHIM/"
          ls -la "$SHIM" "$SHIM/BIGL" "$SHIM/BIGeneric"

      - name: Apply CI source patches (submodule working tree)
        run: |
          # BIZoomView.m lives in the BIGeneric submodule (IGRSoft/BIGeneric);
          # its contents cannot be committed through this repo, so the fix is
          # applied to the checked-out working tree: NSView _frame ivar ->
          # self.frame, 10 read sites (macOS 15.5 SDK no longer exposes the
          # ivar; KisMac run #12 diagnostic). Guarded: the step fails unless
          # exactly 10 sites exist before and 0 remain after.
          F="Subprojects/BIGeneric/Classes/BIZoomView.m"
          BEFORE=$(grep -c '_frame' "$F")
          perl -pi -e 's/\b_frame\b/self.frame/g' "$F"
          AFTER=$(grep -c 'self\.frame' "$F")
          LEFT=$(grep -c '_frame' "$F" || true)
          echo "BIZoomView.m CI patch: sites_before=$BEFORE self_frame_after=$AFTER leftover=$LEFT"
          test "$BEFORE" = "10" && test "$AFTER" = "10" && test "$LEFT" = "0"

      - name: Build Workbench with unified shell (Release, unsigned, 10.13 floor)
        run: |
          set -o pipefail
          SHIM="$GITHUB_WORKSPACE/.ci-include-shim"
          xcodebuild -workspace KisMac2.xcworkspace -scheme KisMac2 \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=10.13 \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO \
            "HEADER_SEARCH_PATHS=$SHIM \$(inherited)" \
            build 2>&1 | tee xcodebuild.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log

      - name: Package app as zip
        if: success()
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name 'Workbench.app' | grep -v '\.dSYM' | head -1)
          if [ -z "$APP" ]; then
            APP=$(find . -name 'Workbench.app' -path '*Release*' | head -1)
          fi
          echo "Built app: $APP"
          test -n "$APP"
          # Bundle-collision correction (2026-11-08): the unified build ships
          # with its OWN bundle identity, distinct from KisMac. Stamp the
          # staged tag into CFBundleVersion and verify the identity in the
          # built bundle before packaging — fail the run if it is not so.
          PLIST="$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion staged-v1-${{ github.run_number }}" "$PLIST"
          BID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST")
          BNAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleName" "$PLIST")
          BVER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")
          echo "Bundle identity: name=$BNAME id=$BID version=$BVER"
          test "$BID" = "com.detroitautomationacademy.workbench"
          test "$BNAME" = "Workbench"
          test "$BVER" = "staged-v1-${{ github.run_number }}"
          # Academy audit entry gate (Distro files/08): the built plist must
          # carry com.detroitautomationacademy.audit with all flags true —
          # Distro's installer refuses anything else. Fail the run otherwise.
          AUD="com.detroitautomationacademy.audit"
          A_DIS=$(/usr/libexec/PlistBuddy -c "Print :$AUD:Disassembled" "$PLIST")
          A_SCAN=$(/usr/libexec/PlistBuddy -c "Print :$AUD:Scanned" "$PLIST")
          A_REC=$(/usr/libexec/PlistBuddy -c "Print :$AUD:Recompiled" "$PLIST")
          A_AUTH=$(/usr/libexec/PlistBuddy -c "Print :$AUD:Authority" "$PLIST")
          A_DATE=$(/usr/libexec/PlistBuddy -c "Print :$AUD:Date" "$PLIST")
          echo "Audit entry: Disassembled=$A_DIS Scanned=$A_SCAN Recompiled=$A_REC Authority=$A_AUTH Date=$A_DATE"
          test "$A_DIS" = "true"
          test "$A_SCAN" = "true"
          test "$A_REC" = "true"
          test "$A_AUTH" = "Detroit Automation Academy"
          test "$A_DATE" = "2026-11-08"
          # IP protection T2 (J directive 2026-11-08 04:26): bundle the
          # Academy license and notice in Resources, byte-identical to the
          # governing texts. The files live at the repo root; every other
          # Academy bundle carries them under these exact names.
          cp LICENSE-ACADEMY.txt NOTICE.txt "$APP/Contents/Resources/"
          test -f "$APP/Contents/Resources/LICENSE-ACADEMY.txt"
          test -f "$APP/Contents/Resources/NOTICE.txt"
          ditto -c -k --keepParent "$APP" Workbench-test.zip
          ls -la Workbench-test.zip

      - name: Upload staged build zip (survival copy)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: workbench-zip
          path: Workbench-test.zip

      - name: Publish prerelease with staged build
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create staged-v1-${{ github.run_number }} Workbench-test.zip \
            --prerelease \
            --title "Workbench staged build ${{ github.run_number }} (Switchboard line)" \
            --notes "STAGED INTERNAL BUILD — NOT A RELEASE. Workbench: the unified shell on the remediated KisMac tree: Discover (hosted scanner) + Manage READ for AirPort base stations + Diagnose (Ping, Netstat, Traceroute, Speed Test) + Journal. Ships as Workbench.app, bundle identifier com.detroitautomationacademy.workbench — its own bundle identity, distinct from KisMac (bundle-collision correction, 2026-11-08). CI-built on macos-15; NOT yet verified on the High Sierra rig. Detroit Automation Academy."
